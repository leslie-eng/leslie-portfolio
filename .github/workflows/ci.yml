name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, build, Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Lighthouse CI (mobile + desktop, ≥ 0.95 perf / a11y / SEO)
        run: |
          npx --yes @lhci/cli@0.14.x autorun
          npx --yes @lhci/cli@0.14.x autorun --collect.settings.preset=desktop
